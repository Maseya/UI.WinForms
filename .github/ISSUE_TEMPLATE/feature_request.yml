name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement!
        Please describe the problem you're trying to solve and how the
        proposed feature would help.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        Describe the problem, limitation, or use case that motivates
        this feature request.
      placeholder: |
        As a user, I would like to...
        Currently, I have to...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: |
        Describe the feature or behavior you would like to see.
      placeholder: Explain how you envision this feature working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Have you considered any alternative solutions or workarounds?
      placeholder: Describe any alternatives you have considered.
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples or Mockups
      description: |
        Include code examples, screenshots, mockups, or references
        that help illustrate the proposed feature.
      placeholder: Add any relevant examples or context.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Include any other information that may help evaluate
        this suggestion.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for similar suggestions.
          required: true
        - label: This feature would be useful beyond my specific use case.
          required: false
